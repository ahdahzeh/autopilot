# Daily job ingest, then the daily emails.
#
# This replaces the Vercel cron + hosted-scraper path. That path depended on a
# free-tier container, which was suspended for idling, and ingest stopped on
# 2026-06-10 without anything going red. The runner starts the scraper itself,
# so there is no always-on host to suspend, no 300s function ceiling, and no
# 512 MB memory limit forcing Chromium off.
#
# Shape of a run:
#   plan    turns the shard count into a matrix (a few seconds)
#   ingest  N parallel shards, each with its own scraper, each scraping the
#           users whose id hashes to its index (scripts/ingest/run.ts)
#   emails  after every shard has finished: Gmail sync, onboarding reminders,
#           engagement nudges, daily digest (scripts/ingest/emails.ts). This
#           used to be the Vercel cron at 13:00 UTC, which ran hours before
#           ingest finished, so every digest described yesterday's jobs.
#
# Required repository secrets:
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   RESEND_API_KEY     - the emails job fails without it, on purpose: a red
#                        job is how a missing key gets noticed, a green job
#                        that sent nothing is not.
# Optional:
#   ANTHROPIC_API_KEY  - enables Haiku rescoring. Without it the scraper falls
#                        back to heuristic scores and the run costs nothing.
#   GOOGLE_CLIENT_ID   - with GOOGLE_CLIENT_SECRET, lets the emails job refresh
#   GOOGLE_CLIENT_SECRET each user's Gmail token and sync application statuses
#                        before the digest. Same values as the Vercel env vars
#                        of the same name. Without both, the sync is skipped
#                        and the log says so; the emails still go out.
#
# The repo is public, so these logs are. Neither script prints a user id, an
# email address or a job title; users appear as 8-character hashes.
name: Daily job ingest

on:
  schedule:
    # 09:23 UTC. GitHub delays scheduled runs under load: the 13:00 slot
    # started between 16:01 and 18:53 UTC on 2026-10-16..20, 3 to 6 hours
    # late, and each run then took 48 to 54 minutes. Top-of-the-hour slots
    # are the busiest, so the minute is odd and the hour early. A typical
    # delay plus a 1 hour run lands the digest mid-morning Eastern; even the
    # worst observed delay lands it before 12:30 Eastern instead of
    # mid-afternoon.
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel ingest shards, one scraper each (scheduled runs use 8)"
        default: "8"
        required: false
        type: string
      send_emails:
        description: "Run the emails job after ingest"
        default: true
        required: false
        type: boolean
      emails_dry_run:
        description: "Emails job: report what would be sent, send nothing, write nothing"
        default: false
        required: false
        type: boolean
      user:
        description: "Scrape one user only: the 8-character hash from the logs (the app's Find jobs now button sets this)"
        default: ""
        required: false
        type: string

# Nothing here writes to GitHub, so the token gets read-only access.
permissions:
  contents: read

# One-user runs (the app's Find jobs now) get their own group, so they never
# wait behind the daily run, and GitHub's one-pending-run-per-group rule
# cannot cancel one person's run because someone else onboarded a minute later.
concurrency:
  group: ${{ inputs.user && format('ingest-user-{0}', inputs.user) || 'ingest' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
      total: ${{ steps.matrix.outputs.total }}
    steps:
      - id: matrix
        env:
          # Empty on scheduled runs (no inputs), so the fallback is the
          # scheduled shard count. Change it here to reshard the daily run.
          TOTAL: ${{ inputs.user && '1' || inputs.shards || '8' }}
        run: |
          if ! [[ "$TOTAL" =~ ^[0-9]+$ ]] || [ "$TOTAL" -lt 1 ] || [ "$TOTAL" -gt 20 ]; then
            echo "shards must be an integer from 1 to 20, got '$TOTAL'"
            exit 1
          fi
          shards="[$(seq -s, 0 $((TOTAL - 1)))]"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "ingest will run $TOTAL shards: $shards"

  ingest:
    name: ingest shard ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # One dead shard must not cancel the others: its users are the only ones
      # who miss today, and the emails job still runs for everyone.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    # Users are scraped one at a time at roughly 3 minutes each (17 users took
    # 48 to 54 minutes on 2026-10-16..20, installs included). At 4 shards and
    # 60 users a shard holds 15 users: about 45 minutes of scraping plus 4 of
    # setup. One stuck request is capped at SCRAPE_TIMEOUT_MS (10 minutes), so
    # even five of the fifteen hitting that ceiling finishes inside 80. 120
    # keeps 2.4x headroom over nominal, caps a wedged scraper far below the 6
    # hour job limit, and with the worst observed delay still lets the emails
    # job start before 12:30 Eastern. The runner kills the scraper when the
    # job ends, so a ceiling that is too low silently drops whoever is still
    # queued; as users grow, raise the shard count, not this number.
    timeout-minutes: 120

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RAILWAY_SCRAPER_URL: http://127.0.0.1:8000
      # The runner has 16 GB, so Chromium sources are back on. These two
      # produced 76% of every job the product has ever ingested.
      ALLOW_BROWSER_SOURCES: "1"
      PLAYWRIGHT_CONCURRENCY: "2"
      # Budgets raised 2026-11-10. Shards were finishing in 5 to 10 minutes of
      # their 120, while only 1 of 17 users reached their daily limit (117 of
      # 380 jobs on 2026-10-21) and LinkedIn, the biggest source, ran 6
      # searches with 3 full reads each. 14 searches with 8 reads each cover
      # far more of a user's title x location pairs per day.
      SOURCE_TIMEOUT_SECONDS: "180"
      LINKEDIN_TIMEOUT_SECONDS: "420"
      LINKEDIN_MAX_SEARCHES: "14"
      LINKEDIN_MAX_DETAILS: "8"
      SCRAPE_TIMEOUT_MS: "900000"
      # Federal postings (scraper/scrapers/usajobs.py). Free key from
      # developer.usajobs.gov; without both secrets the source skips itself.
      USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
      USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
      # Set by the app's Find jobs now button: scrape only this user.
      USER_HASH: ${{ inputs.user }}
      # Matches the scraper's lock of one. Higher only queues requests.
      INGEST_CONCURRENCY: "1"
      # run.ts keeps the users whose sha1(id) lands on this index.
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ needs.plan.outputs.total }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        working-directory: scraper
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Start scraper
        working-directory: scraper
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 --log-level info > "$RUNNER_TEMP/scraper.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "scraper healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "scraper never became healthy"
          cat "$RUNNER_TEMP/scraper.log"
          exit 1

      - name: Run ingest
        run: npx tsx scripts/ingest/run.ts

      # Per-source yield, every run. These lines carry counts, timings and
      # block warnings only (user search terms log at DEBUG), so they are safe
      # in this public log. HiringCafe went from 16-19 jobs a day to 0 on
      # 2026-11-07 and nothing showed why; this is where it will show.
      - name: Source summary
        if: always()
        run: |
          grep -E "scraped [0-9]+ jobs in|timed out after|[Cc]loudflare|challenge|NYC Jobs done|USAJOBS done|USAJOBS:.*skipping|HiringCafe: .*hits" "$RUNNER_TEMP/scraper.log" \
            | sed -E 's/^[^|]*\| //' | tail -n 80 || true

      # The scraper logs titles and companies as it goes, and this log is
      # public, so it is only shown when something broke and someone has to
      # read it.
      - name: Scraper log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/scraper.log" || true

  emails:
    needs: [plan, ingest]
    # always(), not the default success(): one failed or timed-out shard must
    # not stop everyone's digest, and the onboarding and engagement emails do
    # not depend on ingest at all. (A timed-out job reports as cancelled, so
    # !cancelled() is not a safe substitute.) The trade-off is that a manually
    # cancelled run still sends its emails, unless send_emails was unticked.
    # A one-user run (Find jobs now) never sends the daily emails.
    if: ${{ always() && !inputs.user && (github.event_name != 'workflow_dispatch' || inputs.send_emails) }}
    runs-on: ubuntu-latest
    # Three campaigns list every auth user and run a couple of queries per
    # profile, plus one Gmail sync call capped at 2 minutes. Minutes, not hours.
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # Both empty when the secrets are missing; emails.ts then skips the
      # Gmail sync and says so. The sync runs in-process (src/lib/gmail-sync.ts)
      # because the site's proxy redirects any cookie-less call to the sync
      # route to /login, so there is no bearer token to pass.
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      # Every link in every email is built from this. Not a secret.
      NEXT_PUBLIC_APP_URL: https://autopilot.ahdahzeh.com
      INGEST_RESULT: ${{ needs.ingest.result }}
      DRY_RUN: ${{ inputs.emails_dry_run && '1' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Send emails
        run: npx tsx scripts/ingest/emails.ts
